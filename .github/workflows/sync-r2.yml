name: Sync release zip to R2

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror (empty = latest release)"
        required: false
        type: string

permissions:
  contents: read

env:
  R2_ENDPOINT: https://f1def7f5c715bcb733f61d58710f5fa1.r2.cloudflarestorage.com
  R2_BUCKET: mintpick-downloads
  SKILL_NAME: writing-agents-md

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download release zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SKILL_NAME.zip" --dir dist

      - name: Upload to R2 (latest + versioned)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          aws s3 cp "dist/$SKILL_NAME.zip" "s3://$R2_BUCKET/$SKILL_NAME.zip" --endpoint-url "$R2_ENDPOINT" --content-type application/zip --no-progress
          aws s3 cp "dist/$SKILL_NAME.zip" "s3://$R2_BUCKET/$SKILL_NAME-$TAG.zip" --endpoint-url "$R2_ENDPOINT" --content-type application/zip --no-progress
